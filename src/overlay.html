<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none; user-select: none;
        cursor: default;
      }

      /* The buddy lives in the bottom-right corner. */
      #buddy {
        position: absolute; right: 26px; bottom: 26px;
        width: 56px; height: 56px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #c4b5fd, #7c3aed 70%);
        box-shadow: 0 8px 30px -6px rgba(124, 58, 237, 0.7), 0 0 0 2px rgba(255,255,255,0.12) inset;
        display: grid; place-items: center;
        transition: transform 0.25s ease;
      }
      #buddy .eyes { display: flex; gap: 7px; }
      #buddy .eye {
        width: 8px; height: 8px; border-radius: 50%; background: #1b1030;
      }
      #buddy.listening { transform: scale(1.12); }
      #buddy.listening::after {
        content: ""; position: absolute; inset: -8px; border-radius: 50%;
        border: 2px solid rgba(196,181,253,0.8);
        animation: ring 1.1s ease-out infinite;
      }
      #buddy.thinking .eye { animation: blink 0.6s steps(2) infinite; }
      @keyframes ring { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.5); opacity: 0; } }
      @keyframes blink { 50% { opacity: 0.2; } }

      /* Caption bubble above the buddy. */
      #caption {
        position: absolute; right: 26px; bottom: 96px;
        max-width: 360px;
        background: rgba(16, 13, 26, 0.92);
        color: #f3f1f8; border: 1px solid rgba(196,181,253,0.25);
        border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.45;
        box-shadow: 0 12px 40px -12px rgba(0,0,0,0.8);
        opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s;
      }
      #caption.show { opacity: 1; transform: translateY(0); }
      #caption .you { color: #9d8bf5; font-size: 12px; margin-bottom: 4px; }

      /* Small status line under the buddy (wake/enroll). */
      #status {
        position: absolute; right: 26px; bottom: 8px;
        font-size: 11px; color: #c4b5fd; text-align: right;
        text-shadow: 0 1px 4px rgba(0,0,0,0.8); opacity: 0;
        transition: opacity 0.2s;
      }
      #status.show { opacity: 0.9; }

      /* The flying pointer. */
      #pointer {
        position: absolute; left: 0; top: 0; width: 0; height: 0;
        opacity: 0; will-change: transform;
      }
      #pointer .tri {
        width: 0; height: 0;
        border-left: 13px solid transparent; border-right: 13px solid transparent;
        border-bottom: 22px solid #a78bfa;
        transform: rotate(-35deg);
        filter: drop-shadow(0 3px 8px rgba(124,58,237,0.9));
      }
      #pointer .halo {
        position: absolute; left: -22px; top: -8px; width: 44px; height: 44px;
        border-radius: 50%; border: 2px solid rgba(167,139,250,0.9);
        animation: halo 1.2s ease-out infinite;
      }
      #pointer .tag {
        position: absolute; left: 18px; top: 16px; white-space: nowrap;
        background: #a78bfa; color: #1a1226; font-size: 12px; font-weight: 600;
        padding: 3px 8px; border-radius: 8px;
      }
      @keyframes halo { from { transform: scale(0.6); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="pointer"><div class="halo"></div><div class="tri"></div><div class="tag"></div></div>
    <div id="caption"><div class="you"></div><div class="msg"></div></div>
    <div id="status"></div>
    <div id="buddy"><div class="eyes"><div class="eye"></div><div class="eye"></div></div></div>
    <script src="./overlay.js"></script>
  </body>
</html>
